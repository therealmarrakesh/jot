[package]
name = "jot"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
gpui-kit = { version = "0.7", default-features = false, features = ["component"] }
gpui-pre-windows = "0.3.9"
raw-window-handle = "0.6"
regex = "1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[features]
bench = []

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
lto = true
codegen-units = 1
strip = true
