[package]
edition = "2024"
name = "gpui"
version = "0.3.9"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"

[features]
default = []
font-kit = []
inspector = []
leak-detection = []
profiler = []
screen-capture = []
stacker = []
test-support = []
wayland = []
windows-manifest = []
x11 = []

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"
async-task = "4.7"
bitflags = "2.6.0"
log = { version = "0.4", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "content_size"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Hlsl",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows-numerics]
version = "0.3"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
